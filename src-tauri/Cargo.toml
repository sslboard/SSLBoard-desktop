[package]
name = "SSLBoard-desktop"
description = "A Tauri App"
authors = ["Chris Hartwig"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sslboard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ACME client for Let's Encrypt / public certificate issuance
instant-acme = { git = "https://github.com/djc/instant-acme", branch = "main" }
sha2 = "0.10"
hex = "0.4"
rustls-pki-types = "1"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# PKI / Certificate operations
rcgen = { version = "0.14", features = ["aws_lc_rs"] }  # Certificate and CSR generation
x509-parser = { version = "0.18", features = ["verify"] }  # X.509 certificate parsing
pem = "3.0"  # PEM encoding/decoding
pkcs12 = "0.2.0-pre.0"  # PFX/PKCS#12 export for Windows

# Secret storage (OS keychain adapters)
keyring = "2.3"  # Cross-platform: macOS Keychain, Windows Credential Vault, Linux Secret Service
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = "1.7"

# Kubernetes client for distribution
kube = { version = "0.92", features = ["runtime", "client"] }
k8s-openapi = { version = "0.22", features = ["v1_30"] }  # Kubernetes API version (v1.30 is recent stable)

# Metadata storage (non-secret)
rusqlite = { version = "0.32", features = ["bundled"] }  # SQLite for certificate inventory, audit log

# Async runtime (Tauri uses tokio, but we may need additional features)
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# HTTP client for DNS provider APIs
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
ureq = "2.10"

# AWS SDK for Route 53
aws-sdk-route53 = "1"
aws-config = "1"

# Cloudflare API (using reqwest directly, no official SDK)
# DigitalOcean API (using reqwest directly, no official SDK)

# Error handling
thiserror = "1.0"
anyhow = "1.0"
idna = "1.1"

# Logging
log = "0.4"
env_logger = "0.11"

# Time/date handling for certificate expiry, audit logs
chrono = { version = "0.4", features = ["serde"] }

# IDs for secret references
uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS biometric Keychain support
security-framework = { version = "3.5", features = ["OSX_10_13"] }
security-framework-sys = { version = "2.15", features = ["OSX_10_13"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"

[features]
integration-tests = []
